<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101116">
    <title>Noema · Terminal</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/chrome.css">
    <link rel="stylesheet" href="css/workspace.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="css/notes.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/config.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside id="app-sidebar" class="terminal-sidebar">
        <div class="sidebar-top">
          <button id="btn-collapse-sidebar" class="icon-btn sidebar-toggle" aria-label="Ocultar panel lateral" aria-controls="app-sidebar" aria-expanded="true" title="Ocultar panel lateral"><img class="icon" src="images/current/sidebar.svg" width="18" height="18" alt=""></button>
          <div class="brand-lockup"><div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div><div><div class="brand-name">Noema</div><div class="brand-caption">consciencia persistente</div></div></div>
        </div>
        <div class="sidebar-footer"><div class="agent-state"><span class="state-orb"></span><span>Noema está disponible</span></div><button id="btn-export" class="sidebar-action"><span>↓</span><span>Descargar conversación</span></button><button id="btn-copy-conversation" class="sidebar-action"><span>▣</span><span>Copiar conversación</span></button><button id="btn-config" class="sidebar-action"><span>⚙</span><span>Configuración</span></button></div>
      </aside>

      <div class="main-column">
        <header class="main-header">
          <div class="header-left">
            <div class="mobile-brand"><div class="brand-mark small"><i></i><i></i><i></i></div><span>Noema</span></div>
            <button id="btn-expand-sidebar" class="icon-btn sidebar-toggle" aria-label="Mostrar panel lateral" aria-controls="app-sidebar" aria-expanded="false" title="Mostrar panel lateral"><img class="icon" src="images/current/sidebar.svg" width="18" height="18" alt=""></button>
            <button id="btn-toggle-workspace" class="icon-btn workspace-toggle" aria-label="Mostrar panel de espacio de trabajo" aria-controls="work-area" aria-expanded="false" title="Mostrar panel de espacio de trabajo"><img class="icon" src="images/current/workspace.svg" width="18" height="18" alt=""></button>
          </div>
          <div class="header-right">
            <div class="header-tools"><label class="terminal-input-wrap"><span>Terminal</span><input id="terminal-id" type="text" placeholder="ID del terminal" autocomplete="off"></label><div id="status-indicator" class="status-indicator"><span class="status-dot connecting"></span><span id="status-text">Conectando...</span></div><button id="btn-mobile-config" class="icon-btn mobile-config-button">⚙</button></div>
          </div>
        </header>

        <!-- Los contenedores de primer nivel son huecos: cada componente construye su markup. -->
        <main class="main-panel">
          <div id="work-area" class="work-area">
            <div class="area-tabbar"></div>
            <div class="area-body"></div>
          </div>
          <div id="splitter-workspace" class="splitter" role="separator" aria-orientation="vertical" aria-label="Redimensionar panel de trabajo"></div>
          <div class="conversation-shell">
            <!-- El chat construye aqui su tabbar, sus paneles y su composer (chat-markup.js) -->
            </div>
        </main>
      </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <!-- La ventana de configuracion la construye config-markup.js bajo demanda -->
    <script src="vendor/ace/ace.js"></script>
    <script src="vendor/ace/ext-searchbox.js"></script>
    <script src="vendor/ace/mode-java.js"></script>
    <script src="vendor/ace/mode-xml.js"></script>
    <script src="vendor/ace/mode-json.js"></script>
    <script src="vendor/ace/mode-markdown.js"></script>
    <script src="vendor/ace/mode-sh.js"></script>
    <script src="vendor/ace/mode-groovy.js"></script>
    <script src="vendor/ace/mode-properties.js"></script>
    <script src="vendor/ace/mode-yaml.js"></script>
    <script src="vendor/ace/mode-html.js"></script>
    <script src="vendor/ace/mode-css.js"></script>
    <script src="vendor/ace/mode-javascript.js"></script>
    <script src="vendor/ace/theme-dracula.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
